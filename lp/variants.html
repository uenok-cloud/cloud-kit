<title>成約職人 訴求一覧</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: LPと同じ温かい紙色とコーラル。訴求ごとに「見出しの試し刷り」を並べる */
:root{
  --paper:#FAF9F5; --surface:#FFFFFF; --ink:#141413; --muted:#6B6A63; --line:#E5E2D8; --seal:#A34A2F; --seal-soft:#F7E6DD;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#1F1E1D;--surface:#2A2927;--ink:#F0EEE6;--muted:#A3A097;--line:#3A3935;--seal:#EC9B7C;--seal-soft:#3D2A22;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#1F1E1D;--surface:#2A2927;--ink:#F0EEE6;--muted:#A3A097;--line:#3A3935;--seal:#EC9B7C;--seal-soft:#3D2A22;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.75;font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin-inline:auto;padding-block:3rem 4rem}
h1,h2{margin:0;text-wrap:balance;line-height:1.3}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.top h1{font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,4vw,2.6rem);margin-top:.5rem}
.top h1 em{font-style:normal;color:var(--seal)}
.top p{color:var(--muted);max-width:44em;margin-top:.75rem}
.how{margin-top:1rem;display:inline-flex;flex-wrap:wrap;gap:.4rem;align-items:center;font-family:var(--mono);font-size:.8rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.5rem .8rem;max-width:100%;overflow-wrap:anywhere}
.how b{color:var(--seal)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:1rem;margin-top:2.5rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.4rem;display:flex;flex-direction:column;gap:.9rem;min-width:0}
.meta{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.no{font-family:var(--mono);font-size:.72rem;color:var(--muted);letter-spacing:.1em}
.angle{font-size:.75rem;font-weight:700;padding:.1rem .65rem;border-radius:999px;background:var(--seal-soft);color:var(--seal)}
.card h2{font-family:var(--display);font-weight:400;font-size:1.45rem;line-height:1.35}
.card h2 span,.card h2 em{display:inline-block}
.card h2 em{font-style:normal;color:var(--seal)}
.target{font-size:.82rem;color:var(--muted);border-left:2px solid var(--line);padding-left:.7rem}
.lead{font-size:.86rem}
.lead strong{background:linear-gradient(transparent 62%,var(--seal-soft) 62%)}
.cta{font-size:.78rem;color:var(--muted)}
.cta b{color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:auto;padding-top:.6rem;border-top:1px dashed var(--line)}
.btn{display:inline-flex;align-items:center;border-radius:999px;padding:.45rem 1rem;font:700 .8rem var(--body);cursor:pointer;text-decoration:none;border:1px solid var(--line);background:transparent;color:var(--ink)}
.btn.main{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
code{font-family:var(--mono);font-size:.75rem;color:var(--muted);overflow-wrap:anywhere}
</style>
<div class="wrap">
  <div class="top">
    <p class="eyebrow">成約職人｜訴求の一覧｜9本</p>
    <h1>同じLPを、<em>訴求ごと</em>に出し分ける。</h1>
    <p>LPのリンクの末尾に <b>#訴求ID</b> を付けると、ファーストビューの見出し・説明文・ボタンがその訴求に切り替わります。広告、DM、紹介先ごとにリンクを使い分けてください。</p>
    <div class="how">https://claude.ai/artifact/DPCr297QAx8YmGUzptxC1g<b>#closer</b></div>
  </div>
  <div class="grid" id="grid"></div>
</div>
<script>
document.documentElement.lang = "ja";
const LP = "https://claude.ai/artifact/DPCr297QAx8YmGUzptxC1g";
const V = [{"id": "shikumi", "angle": "仕組み", "target": "AIの仕組み化は進んでいるが、営業は属人のままの会社", "h1": ["AIの仕組みは", "あるけど、", "|", "*営業の仕組み", "つくりませんか？"], "lead": "成約職人は、AI・IT企業のためのクロージングチームです。リードは御社が取ってくる。そこから先は、私たちが営業責任者として商談を回し、", "cta": "商談を任せてみる"}, {"id": "closer", "angle": "クローザー不在", "target": "プロダクトもリードもあるのに、契約を決め切る人がいない会社", "h1": ["良い仕組み", "だけど、", "|", "*クローザー", "がいない。"], "lead": "プロダクトもある。リードも来ている。足りないのは、契約まで持っていく人だけです。成約職人が営業責任者として商談に入り、", "cta": "クローザーを入れる"}, {"id": "saiyo", "angle": "採用の代わり", "target": "営業責任者を採用しようとして、決まらない・高すぎる会社", "h1": ["営業責任者を", "採用する前に、", "|", "*月5万円", "から", "始めませんか？"], "lead": "営業責任者の採用は、年収も時間もかかり、決まる保証もありません。成約職人なら月5万円から、6か月の契約で営業責任者が入ります。リードを渡せば、", "cta": "月5万円から始める"}, {"id": "inquiry", "angle": "リードの取りこぼし", "target": "問い合わせ・資料請求は来るが、売上に変わっていない会社", "h1": ["問い合わせは", "来るのに、", "|", "*売上", "にならない。"], "lead": "広告もSEOも回っている。それでも売上が伸びないなら、問題は商談のあとです。成約職人が営業責任者として、来たリードを一件ずつ", "cta": "止まっているリードを相談する"}, {"id": "focus", "angle": "開発に集中", "target": "社長やエンジニアが営業を兼任して、開発が止まっている会社", "h1": ["社長も", "エンジニアも、", "|", "*もう営業", "しなくていい。"], "lead": "作る人が売る人を兼ねると、開発も営業も中途半端になります。商談は成約職人の営業責任者に任せてください。リードを渡せば、", "cta": "営業を手放す"}, {"id": "kentou", "angle": "検討止まり", "target": "デモの評価は高いのに「検討します」で止まる会社", "h1": ["「すごいですね、", "検討します」で", "|", "*終わらせない。"], "lead": "良いデモのあとに商談が止まるのは、決裁者が動く理由を渡せていないからです。成約職人が費用対効果と導入の道筋を示し、", "cta": "止まった商談を見せる"}, {"id": "chakkin", "angle": "入金まで", "target": "受注しても入金・稼働までに失速しがちな会社", "h1": ["契約で", "終わらせない。", "|", "*初回着金", "まで", "追いかける。"], "lead": "「契約しました」で営業が手を離すと、稼働も入金もずれ込みます。成約職人は営業責任者として、受注のその先まで責任を持ち、", "cta": "着金まで任せる"}, {"id": "ikki", "angle": "実績", "target": "数字で判断したい、実績重視の決裁者", "h1": ["1週間で", "*150万円", "着金。", "|", "そのクロージングを", "御社にも。"], "lead": "自社サービス「一騎当千」では、取ってきたリードを1週間で150万円の着金に変え、さらに100万円が見込みに入っています。同じやり方で、", "cta": "同じやり方で売ってもらう"}, {"id": "seika", "angle": "成果報酬", "target": "固定費の高い営業代行に失敗したことがある会社", "h1": ["報酬の大半は、", "|", "*成約", "したときだけ。"], "lead": "月額は5万円から。報酬の大部分は成約した初年度分の受注金額に応じた成果報酬です。売れなければ、かかるのは月額だけです。成約職人が", "cta": "成果報酬で相談する"}];
const esc = (t) => t.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plain = (h) => h.filter(t => t !== "|").map(t => t.replace(/^\*/, "")).join("");
document.getElementById("grid").innerHTML = V.map((v, i) => `
  <article class="card">
    <div class="meta"><span class="no">${String(i + 1).padStart(2, "0")} · #${v.id}</span><span class="angle">${esc(v.angle)}</span></div>
    <h2>${v.h1.map(t => t === "|" ? "<br>" : t[0] === "*" ? `<em>${esc(t.slice(1))}</em>` : `<span>${esc(t)}</span>`).join("")}</h2>
    <p class="target">${esc(v.target)}</p>
    <p class="lead">${esc(v.lead)}<strong>契約締結、初回着金まで追いかけます。</strong></p>
    <p class="cta">ボタン：<b>${esc(v.cta)}</b></p>
    <div class="actions">
      <a class="btn main" href="${LP}#${v.id}" target="_blank" rel="noopener">LPで見る</a>
      <button class="btn" type="button" data-copy="${esc(plain(v.h1))}">見出しをコピー</button>
      <button class="btn" type="button" data-copy="${LP}#${v.id}">リンクをコピー</button>
    </div>
  </article>`).join("");
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-copy]"); if (!b) return;
  const label = b.textContent;
  try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "コピーしました"; }
  catch { b.textContent = b.dataset.copy; }
  setTimeout(() => { b.textContent = label; }, 1800);
});
</script>
